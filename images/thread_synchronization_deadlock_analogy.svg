<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <!-- Main Title Banner -->
  <rect x="50" y="25" width="1100" height="60" rx="12" fill="#0f172a" filter="url(#shadow2)"/>
  <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    THREAD SYNCHRONIZATION, MONITORS &amp; DEADLOCK AVOIDANCE
  </text>

  <!-- Left Panel: Synchronized Monitor Lock -->
  <rect x="50" y="105" width="530" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="50" y="105" width="530" height="50" rx="16" fill="#eff6ff"/>
  <text x="315" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">
    🔒 Synchronized Monitor: Single Restroom Door Lock
  </text>

  <!-- Graphic: Restroom Lock Analogy -->
  <g transform="translate(100, 175)">
    <!-- Restroom Door Structure -->
    <rect x="220" y="20" width="160" height="190" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
    
    <!-- Lock Badge: OCCUPIED (RED) -->
    <rect x="250" y="40" width="100" height="35" rx="6" fill="#ef4444"/>
    <text x="300" y="63" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">🔒 OCCUPIED</text>

    <!-- Inside Thread executing critical section -->
    <circle cx="300" cy="130" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="137" font-size="16" text-anchor="middle">👤</text>
    <text x="300" y="170" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Thread A (Has Lock)</text>

    <!-- Waiting Queue (BLOCKED) -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="170" height="90" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4"/>
      <text x="85" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">BLOCKED Entry Queue</text>
      
      <circle cx="45" cy="55" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="45" y="60" font-size="12" text-anchor="middle">👤</text>
      <text x="45" y="80" font-family="sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Thread B</text>

      <circle cx="115" cy="55" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="115" y="60" font-size="12" text-anchor="middle">👤</text>
      <text x="115" y="80" font-family="sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Thread C</text>
    </g>

    <!-- Arrow from queue to door -->
    <path d="M 195 125 L 215 125" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Left Bottom Explanations -->
  <rect x="70" y="430" width="490" height="75" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="315" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">
    • Every Java Object has 1 Intrinsic Monitor Lock in Heap
  </text>
  <text x="315" y="475" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">
    • Only 1 thread executes synchronized block; others wait in BLOCKED state
  </text>

  <!-- Right Panel: Deadlock Avoidance -->
  <rect x="620" y="105" width="530" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="620" y="105" width="530" height="50" rx="16" fill="#fef3c7"/>
  <text x="885" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">
    ⚠️ Deadlock Trap vs Ordered Lock Solution
  </text>

  <!-- Graphic: Deadlock Circular Wait & Fix -->
  <g transform="translate(660, 175)">
    <!-- Chef 1 -->
    <g transform="translate(20, 20)">
      <circle cx="40" cy="30" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="40" y="37" font-size="18" text-anchor="middle">👨‍🍳</text>
      <text x="40" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Chef 1 (Holds Knife)</text>
    </g>

    <!-- Chef 2 -->
    <g transform="translate(350, 20)">
      <circle cx="40" cy="30" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="40" y="37" font-size="18" text-anchor="middle">👩‍🍳</text>
      <text x="40" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Chef 2 (Holds Board)</text>
    </g>

    <!-- Resource 1: Knife -->
    <rect x="180" y="10" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="230" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">🔪 Lock A: Knife</text>

    <!-- Resource 2: Cutting Board -->
    <rect x="170" y="110" width="120" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="230" y="135" font-family="sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">🪵 Lock B: Board</text>

    <!-- Circular Wait Arrows -->
    <path d="M 80 40 L 175 30" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="125" y="25" font-family="sans-serif" font-size="10" font-weight="700" fill="#166534">HOLDS</text>

    <path d="M 70 65 L 170 120" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
    <text x="100" y="105" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">WAITS FOR</text>

    <path d="M 370 40 L 285 30" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
    <text x="315" y="25" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">WAITS FOR</text>

    <path d="M 370 65 L 295 120" stroke="#22c55e" stroke-width="2"/>
    <text x="325" y="105" font-family="sans-serif" font-size="10" font-weight="700" fill="#166534">HOLDS</text>
  </g>

  <!-- Right Bottom Explanations -->
  <rect x="640" y="430" width="490" height="75" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="885" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">
    • Circular Wait = Permanent Freeze (Deadlock!)
  </text>
  <text x="885" y="475" font-family="sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">
    💡 Fix: Enforce Global Rule — All threads must acquire Knife FIRST, then Board!
  </text>

  <!-- Bottom Core Principle Banner -->
  <rect x="50" y="545" width="1100" height="100" rx="14" fill="#1e293b" filter="url(#shadow2)"/>
  <text x="600" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">
    GOLDEN RULE OF JAVA THREAD SAFETY &amp; LOCKING
  </text>
  <text x="600" y="612" font-family="sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">
    Keep synchronized blocks as small as possible (Lock only the Critical Section) &amp; always acquire multiple locks in identical global order.
  </text>
</svg>
