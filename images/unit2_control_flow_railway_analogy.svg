<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="180" fill="#06b6d4" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="220" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>

  <!-- Main Title Banner -->
  <rect x="50" y="30" width="1100" height="65" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="600" y="70" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    REAL-WORLD ANALOGY: CONTROL FLOW &amp; BRANCHING ARCHITECTURE
  </text>

  <!-- Left Panel: Railway Track Switcher Analogy (Java Switch Statement) -->
  <g transform="translate(60, 120)">
    <rect width="520" height="500" rx="18" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="2.5"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="480" height="50" rx="10" fill="#0369a1" opacity="0.3"/>
    <text x="35" y="52" fill="#38bdf8" font-size="18" font-weight="bold" font-family="sans-serif">
      🚂 1. SWITCH STATEMENT: RAILWAY TRACK SWITCHER
    </text>

    <!-- Visual Diagram Area -->
    <rect x="25" y="85" width="470" height="230" rx="12" fill="#090d16" stroke="#1e293b"/>
    
    <!-- Incoming Train Track -->
    <line x1="45" y1="195" x2="160" y2="195" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="45" y1="205" x2="160" y2="205" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Sleepers -->
    <line x1="60" y1="185" x2="60" y2="215" stroke="#64748b" stroke-width="3"/>
    <line x1="85" y1="185" x2="85" y2="215" stroke="#64748b" stroke-width="3"/>
    <line x1="110" y1="185" x2="110" y2="215" stroke="#64748b" stroke-width="3"/>
    <line x1="135" y1="185" x2="135" y2="215" stroke="#64748b" stroke-width="3"/>

    <!-- Incoming Train (Expression Key) -->
    <rect x="45" y="145" width="90" height="40" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="170" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">key = 2</text>

    <!-- Track Switch Junction -->
    <circle cx="180" cy="200" r="16" fill="#f59e0b" filter="url(#glow)"/>
    <text x="180" y="205" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">⚙️</text>

    <!-- Branch Tracks (Cases) -->
    <!-- Track 1 -->
    <path d="M 180 200 Q 250 130 460 120" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="6,4"/>
    <rect x="360" y="105" width="120" height="30" rx="6" fill="#334155"/>
    <text x="420" y="125" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">case 1: Platform A</text>

    <!-- Track 2 (Selected Match!) -->
    <path d="M 180 200 Q 250 190 460 190" fill="none" stroke="#22c55e" stroke-width="7" filter="url(#glow)"/>
    <rect x="340" y="175" width="145" height="32" rx="6" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
    <text x="412" y="196" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">case 2: MATCHED! ⚡</text>

    <!-- Track 3 -->
    <path d="M 180 200 Q 250 270 460 270" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="6,4"/>
    <rect x="360" y="255" width="120" height="30" rx="6" fill="#334155"/>
    <text x="420" y="275" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">default: Yard Depot</text>

    <!-- Concept Explanation -->
    <rect x="25" y="330" width="470" height="145" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="360" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">Direct Jump Table (O(1) Evaluation):</text>
    <text x="40" y="388" fill="#cbd5e1" font-size="13" font-family="sans-serif">• Unlike an if-else chain that evaluates each condition top-to-bottom,</text>
    <text x="40" y="410" fill="#cbd5e1" font-size="13" font-family="sans-serif">• The Switch statement jumps directly to the matching case branch,</text>
    <text x="40" y="432" fill="#cbd5e1" font-size="13" font-family="sans-serif">• Exactly like a track switch routing trains directly to designated tracks.</text>
    <text x="40" y="456" fill="#fcd34d" font-size="12" font-weight="bold" font-family="sans-serif">💡 Arrow syntax (->) eliminates accidental fall-through bugs!</text>
  </g>

  <!-- Right Panel: Labeled Break/Continue Express Toll Analogy -->
  <g transform="translate(620, 120)">
    <rect width="520" height="500" rx="18" fill="url(#cardGrad)" stroke="#d97706" stroke-width="2.5"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="480" height="50" rx="10" fill="#b45309" opacity="0.3"/>
    <text x="35" y="52" fill="#fbbf24" font-size="18" font-weight="bold" font-family="sans-serif">
      🛣️ 2. LABELED BREAK / CONTINUE: EXPRESS TOLL BYPASS
    </text>

    <!-- Visual Diagram Area -->
    <rect x="25" y="85" width="470" height="230" rx="12" fill="#090d16" stroke="#1e293b"/>

    <!-- Nested Loop Levels -->
    <rect x="40" y="100" width="440" height="200" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="55" y="125" fill="#fbbf24" font-size="13" font-weight="bold" font-family="monospace">OUTER_LOOP: (Highway Corridor)</text>

    <rect x="60" y="140" width="400" height="145" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="75" y="162" fill="#38bdf8" font-size="12" font-weight="bold" font-family="monospace">INNER_LOOP: (Toll Plaza Lanes)</text>

    <!-- Checkpoint Lanes -->
    <g transform="translate(75, 175)">
      <!-- Lane 1: normal iteration -->
      <rect x="0" y="0" width="90" height="35" rx="6" fill="#334155"/>
      <text x="45" y="22" fill="#94a3b8" font-size="11" text-anchor="middle">Lane 1 [OK]</text>

      <!-- Lane 2: Continue (Skip Rest of Loop Body) -->
      <rect x="105" y="0" width="115" height="35" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="162" y="17" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">Lane 2 [SKIP]</text>
      <text x="162" y="30" fill="#bfdbfe" font-size="9" text-anchor="middle">continue; (Next car)</text>

      <!-- Lane 3: Labeled Break (Instant Exit from All Nested Loops) -->
      <rect x="235" y="0" width="135" height="35" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
      <text x="302" y="17" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">EMERGENCY EXIT 🚨</text>
      <text x="302" y="30" fill="#fecaca" font-size="9" text-anchor="middle">break OUTER_LOOP;</text>
    </g>

    <!-- Express Exit Escape Arrow -->
    <path d="M 377 220 C 420 250, 470 230, 480 80" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <polygon points="480,75 470,90 490,90" fill="#ef4444"/>
    <text x="375" y="260" fill="#ef4444" font-size="12" font-weight="bold" font-family="sans-serif">Bypasses BOTH Loops!</text>

    <!-- Concept Explanation -->
    <rect x="25" y="330" width="470" height="145" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="360" fill="#fbbf24" font-size="14" font-weight="bold" font-family="sans-serif">Deep Nested Loop Navigation:</text>
    <text x="40" y="388" fill="#cbd5e1" font-size="13" font-family="sans-serif">• A standard `break` only terminates the immediate innermost loop,</text>
    <text x="40" y="410" fill="#cbd5e1" font-size="13" font-family="sans-serif">• A `labeled break` acts as an express flyover ramp directly exiting</text>
    <text x="40" y="432" fill="#cbd5e1" font-size="13" font-family="sans-serif">• Out of 2D matrix searches without needing messy boolean flags.</text>
    <text x="40" y="456" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">💡 Clean, high-performance matrix and search pattern navigation.</text>
  </g>
</svg>
