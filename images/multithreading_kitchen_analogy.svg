<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Main Title Banner -->
  <rect x="50" y="25" width="1100" height="60" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    JAVA MULTITHREADING LIFECYCLE &amp; CONCURRENCY ANALOGY
  </text>

  <!-- Left Panel: Single-Threaded -->
  <rect x="50" y="105" width="530" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="105" width="530" height="50" rx="16" fill="#fee2e2"/>
  <text x="315" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#991b1b" text-anchor="middle">
    ⚠️ Single-Threaded: 1 Lone Chef (Sequential Bottleneck)
  </text>

  <!-- Lone Chef Graphic Area -->
  <g transform="translate(100, 175)">
    <!-- Kitchen Table -->
    <rect x="0" y="180" width="430" height="20" rx="6" fill="#94a3b8"/>
    
    <!-- Lone Chef Figure -->
    <circle cx="215" cy="40" r="28" fill="#fbcfe8" stroke="#be185d" stroke-width="3"/>
    <text x="215" y="47" font-size="24" text-anchor="middle">👨‍🍳</text>
    <rect x="195" y="72" width="40" height="60" rx="8" fill="#3b82f6"/>
    
    <!-- Sequential Step Bubbles -->
    <g transform="translate(10, 30)">
      <rect width="90" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="45" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Step 1: Chop</text>
      <text x="45" y="40" font-family="sans-serif" font-size="11" text-anchor="middle">🥗 Salad</text>
    </g>
    <path d="M 105 55 L 125 55" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4"/>

    <g transform="translate(130, 130)">
      <rect width="90" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="45" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Step 2: Boil</text>
      <text x="45" y="40" font-family="sans-serif" font-size="11" text-anchor="middle">🍲 Soup</text>
    </g>

    <g transform="translate(330, 30)">
      <rect width="90" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="45" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Step 3: Bake</text>
      <text x="45" y="40" font-family="sans-serif" font-size="11" text-anchor="middle">🍕 Pizza</text>
    </g>
  </g>

  <!-- Left Bottom Summary -->
  <rect x="70" y="430" width="490" height="75" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="315" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#9f1239" text-anchor="middle">
    • CPU waits idly while 1 thread blocks on I/O or sleep
  </text>
  <text x="315" y="475" font-family="sans-serif" font-size="13" font-weight="700" fill="#9f1239" text-anchor="middle">
    • Total Time = Time(Chop) + Time(Boil) + Time(Bake) (Slow!)
  </text>

  <!-- Right Panel: Multi-Threaded -->
  <rect x="620" y="105" width="530" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="620" y="105" width="530" height="50" rx="16" fill="#dcfce7"/>
  <text x="885" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">
    ⚡ Multi-Threaded: 4 Chefs in Parallel (Shared Kitchen)
  </text>

  <!-- 4 Chefs in Parallel Graphic -->
  <g transform="translate(645, 175)">
    <!-- Central Shared Pantry (Heap) -->
    <rect x="130" y="80" width="220" height="55" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="240" y="105" font-family="sans-serif" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">🏢 SHARED HEAP MEMORY</text>
    <text x="240" y="123" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(Shared Ingredients &amp; Buffers)</text>

    <!-- Chef 1 -->
    <g transform="translate(10, 0)">
      <circle cx="45" cy="25" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
      <text x="45" y="32" font-size="18" text-anchor="middle">👨‍🍳</text>
      <text x="45" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">Thread 1: Salad</text>
      <path d="M 65 35 L 130 90" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3"/>
    </g>

    <!-- Chef 2 -->
    <g transform="translate(380, 0)">
      <circle cx="45" cy="25" r="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="45" y="32" font-size="18" text-anchor="middle">👩‍🍳</text>
      <text x="45" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Thread 2: Soup</text>
      <path d="M 25 35 L -40 90" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3"/>
    </g>

    <!-- Chef 3 -->
    <g transform="translate(10, 160)">
      <circle cx="45" cy="25" r="22" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
      <text x="45" y="32" font-size="18" text-anchor="middle">👨‍🍳</text>
      <text x="45" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Thread 3: Pizza</text>
      <path d="M 65 15 L 130 -25" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3"/>
    </g>

    <!-- Chef 4 -->
    <g transform="translate(380, 160)">
      <circle cx="45" cy="25" r="22" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
      <text x="45" y="32" font-size="18" text-anchor="middle">👩‍🍳</text>
      <text x="45" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#be185d" text-anchor="middle">Thread 4: Dessert</text>
      <path d="M 25 15 L -40 -25" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3"/>
    </g>
  </g>

  <!-- Right Bottom Summary -->
  <rect x="640" y="430" width="490" height="75" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="885" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">
    • All 4 tasks execute concurrently across multiple CPU cores
  </text>
  <text x="885" y="475" font-family="sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">
    • Maximum throughput: Total Time = Max(individual task times)!
  </text>

  <!-- Bottom Lifecycle Bar -->
  <rect x="50" y="545" width="1100" height="100" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <text x="600" y="573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
    JVM THREAD LIFECYCLE STATE MACHINE ANALOGY
  </text>

  <g transform="translate(100, 590)">
    <!-- NEW -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#334155"/>
    <text x="80" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">1. NEW (Hired)</text>
    
    <text x="180" y="23" font-size="16" fill="#38bdf8">→</text>

    <!-- RUNNABLE -->
    <rect x="200" y="0" width="180" height="36" rx="8" fill="#047857"/>
    <text x="290" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. RUNNABLE (Cooking)</text>

    <text x="400" y="23" font-size="16" fill="#38bdf8">→</text>

    <!-- WAITING / BLOCKED -->
    <rect x="420" y="0" width="220" height="36" rx="8" fill="#b45309"/>
    <text x="530" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. WAITING (Oven Timer)</text>

    <text x="660" y="23" font-size="16" fill="#38bdf8">→</text>

    <!-- TERMINATED -->
    <rect x="680" y="0" width="200" height="36" rx="8" fill="#475569"/>
    <text x="780" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. TERMINATED (Shift Over)</text>
  </g>
</svg>
