<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGradTrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="glowHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGradTrust)" rx="16"/>
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="2" rx="16"/>

  <!-- Top Title Header -->
  <g transform="translate(40, 24)">
    <rect width="1120" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="38" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">🛡️ TROUBLESHOOTING GUIDE: ECLIPSE INSTALLER "TRUST ARTIFACTS" DIALOG</text>
    <text x="890" y="38" fill="#34d399" font-family="'Inter', sans-serif" font-size="13" font-weight="700">✓ Safe &amp; Official Verification</text>
  </g>

  <!-- Left Side: Visual Simulation of the Trust Artifacts Window -->
  <g transform="translate(40, 105)" filter="url(#shadowBox)">
    <!-- Window Frame -->
    <rect width="660" height="535" rx="10" fill="url(#windowGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="660" height="38" rx="10" fill="#f1f5f9"/>
    <rect y="28" width="660" height="10" fill="#f1f5f9"/>
    <line x1="0" y1="38" x2="660" y2="38" stroke="#cbd5e1" stroke-width="1"/>
    
    <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
    <text x="35" y="24" fill="#1e293b" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Trust Artifacts</text>
    
    <!-- Window Controls -->
    <rect x="580" y="10" width="18" height="18" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="620" y1="12" x2="634" y2="26" stroke="#64748b" stroke-width="1.5"/>
    <line x1="634" y1="12" x2="620" y2="26" stroke="#64748b" stroke-width="1.5"/>

    <!-- Question Banner -->
    <g transform="translate(20, 52)">
      <text x="0" y="15" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Do you trust these signers? ⚠️ The displayed originator names are not necessarily a reliable certification.</text>
    </g>

    <!-- Certificate Table -->
    <g transform="translate(20, 78)">
      <rect width="620" height="135" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="620" height="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="18" fill="#334155" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Type</text>
      <text x="80" y="18" fill="#334155" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Id / Fingerprint</text>
      <text x="260" y="18" fill="#334155" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Name</text>
      <text x="510" y="18" fill="#334155" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Validity Dates</text>

      <!-- Row 1 (Highlight active row) -->
      <rect y="26" width="620" height="34" fill="#e0f2fe"/>
      <rect x="12" y="35" width="15" height="15" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="35" y="47" fill="#0369a1" font-family="'Inter', sans-serif" font-size="11">x509</text>
      <text x="80" y="47" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="10">821849652371363290...</text>
      <text x="260" y="47" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Eclipse Foundation Inc.; IT; Eclipse...</text>
      <text x="510" y="47" fill="#dc2626" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✕ Expired / Self-Signed</text>

      <!-- Row 2 -->
      <rect y="60" width="620" height="34" fill="#ffffff" stroke="#f1f5f9" stroke-width="0.5"/>
      <rect x="12" y="69" width="15" height="15" rx="2" fill="#0284c7"/>
      <text x="16" y="81" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="900">✓</text>
      <text x="35" y="81" fill="#334155" font-family="'Inter', sans-serif" font-size="11">x509</text>
      <text x="80" y="81" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="10">536413160151681457...</text>
      <text x="260" y="81" fill="#334155" font-family="'Inter', sans-serif" font-size="10">DigiCert SHA2 Assured ID Code Signing</text>
      <text x="510" y="81" fill="#059669" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✓ Valid</text>

      <!-- Row 3 -->
      <rect y="94" width="620" height="34" fill="#ffffff"/>
      <rect x="12" y="103" width="15" height="15" rx="2" fill="#0284c7"/>
      <text x="16" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="900">✓</text>
      <text x="35" y="115" fill="#334155" font-family="'Inter', sans-serif" font-size="11">x509</text>
      <text x="80" y="115" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="10">171547179341205878...</text>
      <text x="260" y="115" fill="#334155" font-family="'Inter', sans-serif" font-size="10">DigiCert Assured ID Root CA</text>
      <text x="510" y="115" fill="#059669" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✓ Valid</text>
    </g>

    <!-- Controls Row 1 -->
    <g transform="translate(20, 226)">
      <rect x="0" y="2" width="14" height="14" rx="2" fill="#0284c7"/>
      <text x="3" y="13" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="900">✓</text>
      <text x="22" y="14" fill="#0f172a" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Remember selected signers</text>

      <rect x="195" y="2" width="14" height="14" rx="2" fill="#ffffff" stroke="#94a3b8"/>
      <text x="217" y="14" fill="#334155" font-family="'Inter', sans-serif" font-size="11">Always trust all content</text>

      <!-- Select All Button (HIGHLIGHT 1) -->
      <rect x="425" y="-5" width="95" height="28" rx="4" fill="#e2e8f0" stroke="#0284c7" stroke-width="2"/>
      <text x="472" y="14" fill="#0369a1" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Select All</text>

      <!-- Deselect Button -->
      <rect x="530" y="-5" width="90" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="575" y="14" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Deselect All</text>
    </g>

    <!-- Certificate Hierarchy Box -->
    <g transform="translate(20, 260)">
      <rect width="620" height="75" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="15" y="22" fill="#334155" font-family="'Inter', sans-serif" font-size="10" font-weight="700">∨ Eclipse Foundation Inc.; IT; Eclipse Foundation Inc.</text>
      <text x="30" y="42" fill="#475569" font-family="'Inter', sans-serif" font-size="10">∨ DigiCert SHA2 Assured ID Code Signing CA; www.digicert.com</text>
      <text x="45" y="60" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">DigiCert Assured ID Root CA; www.digicert.com</text>
    </g>

    <!-- Bundle Table -->
    <g transform="translate(20, 345)">
      <rect width="620" height="50" fill="#ffffff" stroke="#cbd5e1"/>
      <rect width="620" height="20" fill="#f1f5f9"/>
      <text x="10" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Classifier</text>
      <text x="90" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Id</text>
      <text x="510" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Version</text>
      
      <text x="10" y="38" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="10">osgi.bundle</text>
      <text x="90" y="38" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">org.eclipse.m2e.workspace.cli</text>
      <text x="510" y="38" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="10">0.4.0</text>
    </g>

    <!-- Bottom Action Buttons (HIGHLIGHT 2) -->
    <g transform="translate(20, 480)">
      <!-- Trust Selected Button (Pulsing Highlight) -->
      <rect x="420" y="0" width="115" height="34" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="477" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Trust Selected</text>

      <!-- Cancel Button -->
      <rect x="545" y="0" width="75" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="582" y="22" fill="#475569" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Cancel</text>
    </g>
  </g>

  <!-- Right Side: Step-by-Step Instructions & Resolution Callouts -->
  <g transform="translate(730, 105)">
    <!-- Step 1 Explainer Card -->
    <rect width="430" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#0284c7"/>
    <text x="35" y="41" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
    <text x="65" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Click "Select All" Button</text>
    <text x="65" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Ensures all required Eclipse OSGi bundles are checked</text>

    <rect x="25" y="70" width="380" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="38" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Click the <tspan fill="#38bdf8" font-weight="700">"Select All"</tspan> button on the right side</text>
    <text x="38" y="110" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">so all checkbox items (including Eclipse Foundation</text>
    <text x="38" y="128" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">and DigiCert certificates) are checked.</text>

    <!-- Step 2 Explainer Card -->
    <g transform="translate(0, 180)">
      <rect width="430" height="160" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="16" fill="#059669"/>
      <text x="35" y="41" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">2</text>
      <text x="65" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Click "Trust Selected"</text>
      <text x="65" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Confirms package signature and unblocks installation</text>

      <rect x="25" y="70" width="380" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="38" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Click the blue <tspan fill="#34d399" font-weight="700">"Trust Selected"</tspan> button at the bottom.</text>
      <text x="38" y="110" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">The installer progress bar will immediately resume and</text>
      <text x="38" y="128" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">reach 100% completion in ~15-30 seconds.</text>
    </g>

    <!-- Why This Happens Security Note -->
    <g transform="translate(0, 360)">
      <rect width="430" height="175" rx="12" fill="#451a03" stroke="#b45309" stroke-width="1.5"/>
      <text x="25" y="30" fill="#fde68a" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">💡 Why Does Eclipse Ask to Trust Artifacts?</text>
      <text x="25" y="55" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="11" line-height="1.5">
        <tspan x="25" dy="0">Eclipse is built as a modular OSGi ecosystem.</tspan>
        <tspan x="25" dy="18">Every tool, compiler, and Maven integration is an</tspan>
        <tspan x="25" dy="18">independent .jar signed with a digital cryptographic key.</tspan>
        <tspan x="25" dy="22">When older or self-signed timestamp certificates are</tspan>
        <tspan x="25" dy="18">detected, the Oomph installer prompts for user consent.</tspan>
        <tspan x="25" dy="22" fill="#34d399" font-weight="700">✓ It is completely safe to accept and trust.</tspan>
      </text>
    </g>
  </g>
</svg>
