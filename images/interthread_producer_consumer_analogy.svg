<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Main Title Banner -->
  <rect x="50" y="25" width="1100" height="60" rx="12" fill="#0f172a" filter="url(#shadow3)"/>
  <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    INTER-THREAD COMMUNICATION: wait(), notify() &amp; notifyAll()
  </text>

  <!-- Left Panel: Producer (Chef) -->
  <rect x="50" y="105" width="530" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="50" y="105" width="530" height="50" rx="16" fill="#fef3c7"/>
  <text x="315" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">
    👨‍🍳 Producer Thread: Chef Cooking at Station
  </text>

  <!-- Producer Graphic -->
  <g transform="translate(100, 175)">
    <!-- Chef Figure -->
    <circle cx="100" cy="50" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="100" y="58" font-size="26" text-anchor="middle">👨‍🍳</text>
    
    <!-- Action 1: Produce & Put -->
    <rect x="180" y="20" width="220" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="290" y="42" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">1. Cooks &amp; Places Dish on Tray</text>
    <text x="290" y="58" font-family="sans-serif" font-size="10" fill="#166534" text-anchor="middle">buffer.add(item)</text>

    <!-- Action 2: Ring Bell (notifyAll) -->
    <rect x="180" y="85" width="220" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="290" y="107" font-family="sans-serif" font-size="12" font-weight="700" fill="#4338ca" text-anchor="middle">2. Rings Order Bell: 🔔 notifyAll()</text>
    <text x="290" y="123" font-family="sans-serif" font-size="10" fill="#4f46e5" text-anchor="middle">Wakes up waiting Waiters!</text>

    <!-- Condition: Full Buffer -> wait() -->
    <rect x="50" y="155" width="350" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="225" y="177" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">⚠️ If Tray is FULL: Chef calls wait()</text>
    <text x="225" y="193" font-family="sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Releases lock &amp; suspends until waiter clears space</text>
  </g>

  <!-- Left Bottom Explanations -->
  <rect x="70" y="430" width="490" height="75" rx="10" fill="#fffbeb" stroke="#fef3c7"/>
  <text x="315" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">
    • Producer synchronizes on the shared buffer object monitor
  </text>
  <text x="315" y="475" font-family="sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">
    • Signals consumer threads via notifyAll() when new items are ready
  </text>

  <!-- Right Panel: Consumer (Waiter) -->
  <rect x="620" y="105" width="530" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="620" y="105" width="530" height="50" rx="16" fill="#dbeafe"/>
  <text x="885" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    🤵 Consumer Thread: Waiter Serving Customers
  </text>

  <!-- Consumer Graphic -->
  <g transform="translate(670, 175)">
    <!-- Waiter Figure -->
    <circle cx="100" cy="50" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="100" y="58" font-size="26" text-anchor="middle">🤵</text>

    <!-- Condition: Empty Buffer -> wait() -->
    <rect x="180" y="20" width="220" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="290" y="42" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. If Tray is EMPTY: wait()</text>
    <text x="290" y="58" font-family="sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Releases lock and waits for bell ring</text>

    <!-- Action 2: Pick item & Serve -->
    <rect x="180" y="85" width="220" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="290" y="107" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">2. Takes Dish &amp; Serves Customer</text>
    <text x="290" y="123" font-family="sans-serif" font-size="10" fill="#166534" text-anchor="middle">buffer.poll()</text>

    <!-- Action 3: Notify Producer -->
    <rect x="50" y="155" width="350" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="225" y="177" font-family="sans-serif" font-size="12" font-weight="700" fill="#4338ca" text-anchor="middle">3. Signals Chef: 🔔 notifyAll()</text>
    <text x="225" y="193" font-family="sans-serif" font-size="10" fill="#4f46e5" text-anchor="middle">Wakes up Chef that tray now has free space to cook!</text>
  </g>

  <!-- Right Bottom Explanations -->
  <rect x="640" y="430" width="490" height="75" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="885" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">
    • Consumer safely consumes items and releases monitor locks
  </text>
  <text x="885" y="475" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">
    • Always wrap wait() inside while(condition) to prevent spurious wakeups!
  </text>

  <!-- Bottom Object Class Viva Trap Banner -->
  <rect x="50" y="545" width="1100" height="100" rx="14" fill="#1e293b" filter="url(#shadow3)"/>
  <text x="600" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">
    ⭐ INTERVIEW / VIVA TRAP: WHY ARE wait() &amp; notify() IN java.lang.Object?
  </text>
  <text x="600" y="612" font-family="sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">
    Because synchronization locks and monitors belong to individual Objects in Heap memory, NOT to Thread instances!
  </text>
</svg>
