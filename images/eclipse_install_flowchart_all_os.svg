<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGradEcl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGradEcl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="winAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="macAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="linAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glowEcl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGradEcl)" rx="16"/>
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="2" rx="16"/>

  <!-- Top Title Header -->
  <g transform="translate(40, 24)">
    <rect width="1120" height="64" rx="12" fill="url(#cardGradEcl)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="42" cy="32" r="18" fill="#f59e0b"/>
    <text x="42" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" text-anchor="middle">⚙️</text>
    <text x="75" y="30" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">ECLIPSE IDE: UNIVERSAL INSTALLATION &amp; WORKSPACE SETUP PIPELINE</text>
    <text x="75" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Standard Automated Setup for Windows 11/10, macOS (Apple Silicon/Intel) &amp; Linux (x86_64)</text>
    <rect x="990" y="16" width="110" height="32" rx="8" fill="#4f46e5"/>
    <text x="1045" y="37" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">MCA MC101</text>
  </g>

  <!-- 5 Sequential Pipeline Step Cards -->
  <!-- Step 1: Download Portal -->
  <g transform="translate(40, 105)">
    <rect width="205" height="420" rx="12" fill="url(#cardGradEcl)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="12" width="181" height="36" rx="8" fill="#0369a1"/>
    <text x="102" y="35" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">STEP 1: DOWNLOAD</text>
    
    <text x="102" y="75" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="28" text-anchor="middle">🌐</text>
    <text x="102" y="100" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">eclipse.org/downloads</text>
    
    <rect x="16" y="120" width="173" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="140" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">OS Packages:</text>
    <text x="24" y="158" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Windows: .exe (x86_64)</text>
    <text x="24" y="174" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• macOS: .dmg (M1/Intel)</text>
    <text x="24" y="189" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Linux: .tar.gz (x86_64)</text>

    <rect x="16" y="210" width="173" height="190" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="230" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Prerequisite Check:</text>
    <text x="24" y="250" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">java -version</text>
    <text x="24" y="270" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">JDK 17 or 21 Recommended.</text>
    <text x="24" y="295" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Eclipse includes embedded</text>
    <text x="24" y="310" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">JustJ JRE for installer.</text>
    <text x="24" y="340" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="600">💡 Free &amp; Open Source</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(252, 290)">
    <polygon points="0,15 15,0 15,10 25,10 25,20 15,20 15,30" fill="#6366f1" transform="rotate(-90 12 15)"/>
  </g>

  <!-- Step 2: Choose Package -->
  <g transform="translate(270, 105)">
    <rect width="205" height="420" rx="12" fill="url(#cardGradEcl)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="12" y="12" width="181" height="36" rx="8" fill="#4338ca"/>
    <text x="102" y="35" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">STEP 2: SELECT PACKAGE</text>
    
    <text x="102" y="75" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="28" text-anchor="middle">☕</text>
    <text x="102" y="100" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Eclipse IDE for Java Devs</text>

    <rect x="16" y="120" width="173" height="135" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="140" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Bundled Features:</text>
    <text x="24" y="160" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Java Compiler (JDT)</text>
    <text x="24" y="178" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Interactive Debugger</text>
    <text x="24" y="196" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Git Version Control</text>
    <text x="24" y="214" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Maven &amp; Gradle support</text>
    <text x="24" y="232" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• XML &amp; Config Editors</text>

    <rect x="16" y="265" width="173" height="135" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="285" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Default Directory:</text>
    <text x="24" y="305" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">C:\Users\&lt;user&gt;\</text>
    <text x="24" y="320" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">eclipse\java-2024-xx</text>
    <text x="24" y="350" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">✓ Click INSTALL</text>
    <text x="24" y="375" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Accept License agreement</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(482, 290)">
    <polygon points="0,15 15,0 15,10 25,10 25,20 15,20 15,30" fill="#6366f1" transform="rotate(-90 12 15)"/>
  </g>

  <!-- Step 3: Trust Artifacts Dialog -->
  <g transform="translate(500, 105)">
    <rect width="205" height="420" rx="12" fill="url(#cardGradEcl)" stroke="#f59e0b" stroke-width="2" filter="url(#glowEcl)"/>
    <rect x="12" y="12" width="181" height="36" rx="8" fill="#d97706"/>
    <text x="102" y="35" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">STEP 3: TRUST ARTIFACTS</text>
    
    <text x="102" y="75" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="28" text-anchor="middle">🛡️</text>
    <text x="102" y="100" fill="#fde68a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Certificate Verification</text>

    <rect x="16" y="120" width="173" height="150" rx="6" fill="#451a03" stroke="#b45309"/>
    <text x="24" y="140" fill="#fde68a" font-family="'Inter', sans-serif" font-size="11" font-weight="800">⚠️ Key User Action:</text>
    <text x="24" y="160" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="10">1) Check [✓] 'Always trust'</text>
    <text x="24" y="178" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="10">2) Click 'Select All'</text>
    <text x="24" y="198" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700">3) Click [Trust Selected]</text>
    <line x1="24" y1="210" x2="175" y2="210" stroke="#b45309"/>
    <text x="24" y="228" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="9">Signers: Eclipse Foundation &amp;</text>
    <text x="24" y="244" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="9">DigiCert SHA2 Root CA.</text>
    <text x="24" y="260" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="700">✓ 100% Safe &amp; Official</text>

    <rect x="16" y="280" width="173" height="120" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="300" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Why does this show?</text>
    <text x="24" y="320" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Oomph installer verifies</text>
    <text x="24" y="335" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">X.509 code signing</text>
    <text x="24" y="350" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">certificates before</text>
    <text x="24" y="365" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">extracting OSGi bundles.</text>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(712, 290)">
    <polygon points="0,15 15,0 15,10 25,10 25,20 15,20 15,30" fill="#6366f1" transform="rotate(-90 12 15)"/>
  </g>

  <!-- Step 4: Workspace Launcher -->
  <g transform="translate(730, 105)">
    <rect width="205" height="420" rx="12" fill="url(#cardGradEcl)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="12" y="12" width="181" height="36" rx="8" fill="#065f46"/>
    <text x="102" y="35" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">STEP 4: WORKSPACE</text>
    
    <text x="102" y="75" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="28" text-anchor="middle">📁</text>
    <text x="102" y="100" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Select Storage Directory</text>

    <rect x="16" y="120" width="173" height="135" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="140" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Workspace Path:</text>
    <text x="24" y="160" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">C:\Users\&lt;username&gt;\</text>
    <text x="24" y="175" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">eclipse-workspace</text>
    <text x="24" y="200" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Check [✓] 'Use this as</text>
    <text x="24" y="215" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">the default and do not</text>
    <text x="24" y="230" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">ask again'.</text>

    <rect x="16" y="265" width="173" height="135" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="285" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Launch Button:</text>
    <text x="24" y="305" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Click [Launch] to open</text>
    <text x="24" y="320" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">the Eclipse Workbench</text>
    <text x="24" y="335" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">environment.</text>
    <text x="24" y="365" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✓ Ready to Code!</text>
  </g>

  <!-- Flow Arrow 4 -->
  <g transform="translate(942, 290)">
    <polygon points="0,15 15,0 15,10 25,10 25,20 15,20 15,30" fill="#6366f1" transform="rotate(-90 12 15)"/>
  </g>

  <!-- Step 5: First Project & Run -->
  <g transform="translate(960, 105)">
    <rect width="200" height="420" rx="12" fill="url(#cardGradEcl)" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="12" y="12" width="176" height="36" rx="8" fill="#7e22ce"/>
    <text x="100" y="35" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">STEP 5: FIRST PROJECT</text>
    
    <text x="100" y="75" fill="#e879f9" font-family="'JetBrains Mono', monospace" font-size="28" text-anchor="middle">🚀</text>
    <text x="100" y="100" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Create &amp; Execute</text>

    <rect x="14" y="120" width="172" height="150" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="22" y="140" fill="#e879f9" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Creation Steps:</text>
    <text x="22" y="160" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">1. File → New → Java Project</text>
    <text x="22" y="178" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">2. Name: 'MC101_Java'</text>
    <text x="22" y="196" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">3. Right-click src → New Class</text>
    <text x="22" y="214" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">4. Check 'public static void main'</text>
    <text x="22" y="235" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">5. Press Ctrl + F11 to Run!</text>

    <rect x="14" y="280" width="172" height="120" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="22" y="300" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Pro Shortcut:</text>
    <text x="22" y="320" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">syso + Ctrl + Space</text>
    <text x="22" y="338" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Generates System.out.println()</text>
    <text x="22" y="360" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Ctrl + Shift + F</text>
    <text x="22" y="378" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Auto-formats code</text>
  </g>

  <!-- Bottom OS Download & System Architecture Bar -->
  <g transform="translate(40, 545)">
    <rect width="1120" height="110" rx="12" fill="url(#cardGradEcl)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Windows Box -->
    <g transform="translate(20, 15)">
      <rect width="340" height="80" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="20" y="32" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">🪟 Windows 11 / 10 (x86_64)</text>
      <text x="20" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Installer: eclipse-inst-jre-win64.exe</text>
      <text x="20" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Double click exe &amp; select Java Developers</text>
    </g>

    <!-- macOS Box -->
    <g transform="translate(390, 15)">
      <rect width="340" height="80" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="20" y="32" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">🍎 macOS (Apple Silicon &amp; Intel)</text>
      <text x="20" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">DMG: AArch64 (M1/M2/M3) or x86_64</text>
      <text x="20" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Drag Eclipse.app to Applications folder</text>
    </g>

    <!-- Linux Box -->
    <g transform="translate(760, 15)">
      <rect width="340" height="80" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1.2"/>
      <text x="20" y="32" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">🐧 Linux (Ubuntu / Fedora / Arch)</text>
      <text x="20" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Tarball: eclipse-inst-jre-linux64.tar.gz</text>
      <text x="20" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">tar -xvf &amp;&amp; ./eclipse-inst</text>
    </g>
  </g>
</svg>
